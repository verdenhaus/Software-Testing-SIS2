name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    env:
      CI: true
      BASE_URL: http://localhost:4200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install dependencies
        run: mvn -B -ntp test-compile

      - name: Install Playwright browsers
        run: mvn -B -ntp exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Start the shop in Docker
        run: |
          git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git pst
          cd pst
          docker compose -f docker-compose.prod.yml up --pull missing -d

      - name: Seed the database
        working-directory: pst
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan migrate:fresh --seed --force; then
              exit 0
            fi
            echo "Database not ready yet, retrying in 5 s ($i/30)"; sleep 5
          done
          exit 1

      - name: Wait for the shop to be up
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8091/products > /dev/null && curl -sf http://localhost:4200 > /dev/null; then
              echo "Shop is up"; exit 0
            fi
            echo "Waiting for API/UI ($i/60)"; sleep 5
          done
          exit 1

      - name: Run Playwright tests
        run: mvn -B -ntp test
        env:
          SHARD: ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            test-results/
            reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Docker logs (on failure)
        if: failure()
        working-directory: pst
        run: docker compose -f docker-compose.prod.yml logs --tail=100

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: test-results-*

      - name: Merge into HTML + JUnit
        run: python3 scripts/merge_reports.py all-results reports/junit-merged.xml playwright-report

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit-merged.xml
          retention-days: 14

      - name: Publish test summary
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/junit-merged.xml
          check_name: Playwright test results
          include_passed: true
          detailed_summary: true
